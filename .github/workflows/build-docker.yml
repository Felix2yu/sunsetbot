name: Build Docker Image

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  # 双架构矩阵预编译，产物上传 artifact 供 docker job 拼装
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o liuxia .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: liuxia-${{ matrix.label }}
          path: liuxia
          retention-days: 7

  # 各架构拉取预编译二进制，仅拼装镜像，不再容器内编译
  docker:
    runs-on: ${{ matrix.runner }}
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest,    label: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, label: arm64 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert image name to lowercase
        id: lowercase
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Download prebuilt binary
        uses: actions/download-artifact@v8
        with:
          name: liuxia-${{ matrix.label }}
          path: bin

      - name: Build and push arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ steps.lowercase.outputs.image_name }}:${{ github.run_id }}-${{ matrix.label }}
          cache-from: type=gha,scope=${{ matrix.label }}
          cache-to: type=gha,mode=max,scope=${{ matrix.label }}

  merge:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Convert image name to lowercase
        id: lowercase
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          IMAGE=ghcr.io/${{ steps.lowercase.outputs.image_name }}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=${IMAGE}:dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
            echo "tags=${IMAGE}:${TAG},${IMAGE}:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${IMAGE}:master,${IMAGE}:latest" >> $GITHUB_OUTPUT
          fi

      - name: Create and push multi-arch manifest
        run: |
          IMAGE=ghcr.io/${{ steps.lowercase.outputs.image_name }}
          TAG_ARGS=""
          IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.tags }}"
          for TAG in "${TAGS[@]}"; do
            TAG_ARGS="${TAG_ARGS} --tag ${TAG}"
          done
          docker buildx imagetools create \
            ${TAG_ARGS} \
            ${IMAGE}:${{ github.run_id }}-amd64 \
            ${IMAGE}:${{ github.run_id }}-arm64
